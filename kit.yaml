# yaml-language-server: $schema=https://raw.githubusercontent.com/dam-agents/dam-starter-kits/main/kit.schema.json
schemaVersion: v1
id: micro-manager
name: Micro Manager
description: >-
  Reads the messages you send on Slack throughout the day and keeps a list of
  everything you've asked someone to do. Each task stays on the list until you
  mark it done, so nothing you handed off slips through the cracks.
tagline: Never lose track of what you asked someone to do in Slack.
category: productivity
icon: users
harnesses: [claude-code, bob]
docsUrl: https://github.com/dam-agents/micro-manager
seed:
  self: true
  into: home
onboarding:
  prompt: >-
    Read ONBOARDING.md in your home directory and follow it to the end. It asks
    whose Slack is swept, checks the local task store works, writes
    work/CONFIG.md, and ends with a dry run that files nothing until the
    operator confirms it.
connections:
  - accepts: [slack]
    required: true
    note: >-
      Connect as the person whose hand-offs are tracked — the sweep reads their
      own sent messages. A bot account sees nothing useful here.
schedules:
  - name: micro-manager-sweep
    cron: "0 8-20 * * 1-5"
    sessionMode: fresh
    task: >-
      Sweep run. Follow CLAUDE.md → "Sweep run": confirm the Slack identity
      first, load the dedupe set with `tasks list` (open and closed), search your own
      messages back to last_sweep_at, judge each one, file only what is new, then
      update last_sweep_at and report.
